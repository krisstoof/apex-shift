name: Unity Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Repository secrets are not exposed to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity CI secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0

          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing repository secret UNITY_LICENSE"
            missing=1
          fi

          if [ -z "$UNITY_EMAIL" ]; then
            echo "::error::Missing repository secret UNITY_EMAIL"
            missing=1
          fi

          if [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing repository secret UNITY_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Configure Unity secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: ${{ runner.os }}-unity-6000.6.2f1-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**/*.asmdef', 'Assets/**/*.asmref') }}
          restore-keys: |
            ${{ runner.os }}-unity-6000.6.2f1-

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.6.2f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} tests

      - name: Add vegetation performance baseline to summary
        if: always() && matrix.testMode == 'playmode'
        shell: bash
        run: |
          echo "## Vegetation performance baseline" >> "$GITHUB_STEP_SUMMARY"

          if [ -d artifacts ]; then
            matches="$(grep -Rhs '\[VegetationPerfBaseline\]' artifacts 2>/dev/null || true)"
          else
            matches=""
          fi

          if [ -n "$matches" ]; then
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            echo "$matches" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No VegetationPerfBaseline line found in the test artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-results
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: warn
          retention-days: 14
